<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - Restaurante Industrial</title>
    <link rel="stylesheet" href="../css/style-retirada.css">
</head>

<body class="corpo_s">

    <header>
        <h1>LEITURA DE QR CODE</h1>
    </header>

    <main>
        <section id="retirada">
            <h2>Escanear QR Code do aluno</h2>

            <div id="leitor"></div>

            <p id="mensagem" role="status" aria-live="polite"></p>
            <p id="dadosAluno"></p>

            <button id="btnProximo" type="button" hidden>Ler próximo aluno</button>
        </section>

        <section id="manual">
            <h2>Digitar matrícula</h2>

            <label for="matriculaManual">Use se a câmera ou o celular do aluno falhar:</label>
            <input type="text" id="matriculaManual" placeholder="Digite a matrícula" autocomplete="off">
            <button id="btnManual" type="button">Verificar matrícula</button>
        </section>

    </main>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="../scripts/qr-config.js"></script>
    <script src="../scripts/script-retirada.js"></script>

</body>
</html>
