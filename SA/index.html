<html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA Restaurante indústrial</title>
    <link rel="stylesheet" href="style.css">   
    </head>

    <body>
        <header>
            <nav>
                <h1>SA Restaurante indústrial</h1>
                <img src="img/senai-logo.png" alt="Logotipo Senai">
            </nav>
        </header>

        <main>
            <section id="contato">
                <form>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">

                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" placeholder="Digite sua matrícula">

                    <button class="entrada" type="button" onclick="verificarCadastro()">Clique</button>

                    <div id="resultado"></div>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy;Todos direitos reservados.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
